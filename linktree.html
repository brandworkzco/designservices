<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm bg-white rounded-[40px] shadow-2xl overflow-hidden relative border border-gray-100 flex flex-col">

        <!-- Top Blue Header Card with Full Body 3D Avatar Image -->

            <!-- Background glow effect -->
            <div class="absolute -top-12 -right-12 w-48 h-48 bg-blue-400 rounded-full blur-2xl opacity-50 pointer-events-none"></div>

            <!-- Full Body 3D Avatar Image -->
            <div class="relative z-10 w-64 h-64 flex items-center justify-center drop-shadow-xl overflow-visible">
                <img src="https://brandworkzco.github.io/designservices/Bzavatarfin.webp" onerror="this.src='https://brandworkzco.github.io/designservices/Bzavatarfin.webp'" alt="Nur 3D Full Body Character" class="w-full h-full object-contain scale-125 translate-y-4">
            </div>

            <!-- Curved white cut-out tab badge matching reference photo -->
            <div class="absolute bottom-0 left-6 bg-white text-black px-5 py-1.5 rounded-t-2xl font-bold text-sm tracking-wider shadow-md z-20">
                NUR
            </div>
        </div>

        <div class="px-6 pt-6 pb-8 flex-1 flex flex-col justify-between">
            
            <div class="text-center">
                <h1 class="text-2xl font-black text-gray-900 tracking-tight uppercase mb-6">
                    WELCOME TO MY LINK
                </h1>

                <!-- Social Icons Row with Labels -->
                <div class="grid grid-cols-5 gap-2 mb-8">
                    <!-- Website / Store -->
                    <a href="https://brandworkzco.github.io/designservices/" target="_blank" class="flex flex-col items-center group">
                        <img src="https://brandworkzco.github.io/designservices/storeicon.webp" <div="" class="w-12 h-12 rounded-full bg-gray-900 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-200">
                            
                        
                        <span class="text-[11px] font-semibold text-gray-700 mt-1.5">Store</span>
                    </a>
                    <!-- Portfolio / Briefcase -->
                    <a href="https://brandworkzco.github.io/designservices/portfolio.html" target="_blank" class="flex flex-col items-center group">
                        <img src="https://brandworkzco.github.io/designservices/workcaseicon.webp" <div="" class="w-12 h-12 rounded-full bg-amber-700 text-amber-100 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-200">
                            
                        
                        <span class="text-[11px] font-semibold text-gray-700 mt-1.5">Portfolio</span>
                    </a>
                    <!-- Instagram -->
                    <a href="https://www.instagram.com/brandworkz_co" target="_blank" class="flex flex-col items-center group">
                        <img src="https://brandworkzco.github.io/designservices/Instagramicon.webp" <div="" class="w-12 h-12 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-200">
                            
                        
                        <span class="text-[11px] font-semibold text-gray-700 mt-1.5">Instagram</span>
                    </a>
                    <!-- Facebook -->
                    <a href="https://www.facebook.com/share/1JbewEXFzs/" target="_blank" class="flex flex-col items-center group">
                        <img src="https://brandworkzco.github.io/designservices/FBicon.webp" <div="" class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-200">
                            
                        
                        <span class="text-[11px] font-semibold text-gray-700 mt-1.5">Facebook</span>
                    </a>
                    <!-- Shopee -->
                    <a href="https://s.shopee.com.my/1BLt9T1elM" target="_blank" class="flex flex-col items-center group">
                        <img src="https://brandworkzco.github.io/designservices/Shopeeicon.webp" <div="" class="w-12 h-12 rounded-full bg-orange-500 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-200">
                            
                        
                        <span class="text-[11px] font-semibold text-gray-700 mt-1.5">Shopee</span>
                    </a>
                </div>
            </div>

            <div class="mt-auto pt-2">
                <div id="swipe-container" class="relative w-full h-16 bg-[#00779b] rounded-full overflow-hidden shadow-lg select-none flex items-center p-1.5">
                    <!-- Background Track Text -->
                    <div id="swipe-text" class="absolute inset-0 flex items-center justify-center text-white font-semibold text-base tracking-wide pointer-events-none transition-opacity duration-300 pl-10" style="opacity: 1;">
                        swipe the button
                    </div>

                    <!-- Success State Indicator overlay -->
                    <div id="swipe-success" class="absolute inset-0 bg-emerald-600 flex items-center justify-center text-white font-bold text-base opacity-0 transition-opacity duration-300 pointer-events-none" style="opacity: 0;">
                        <i class="fa-solid fa-check-circle mr-2"></i> Shared Successfully!
                    </div>

                    <!-- Draggable Knob -->
                    <div id="swipe-knob" class="relative z-10 w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md cursor-grab active:cursor-grabbing" style="transform: translateX(0px);">
                        <i id="knob-icon" class="fa-solid fa-share-nodes text-[#00779b] text-xl"></i>
                    </div>
                </div>
                <p class="text-center text-xs text-gray-400 mt-2 font-medium">Drag the button to the right to share</p>
            </div>

        </div>

    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl transition-all duration-300 z-50 flex items-center gap-3 opacity-0 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Opening Portfolio...</span>
    </div>

    <script>
        const container = document.getElementById('swipe-container');
        const knob = document.getElementById('swipe-knob');
        const swipeText = document.getElementById('swipe-text');
        const swipeSuccess = document.getElementById('swipe-success');
        const knobIcon = document.getElementById('knob-icon');

        let isDragging = false;
        let startX = 0;
        let currentTranslate = 0;
        let maxTranslate = 0;
        let isCompleted = false;

        function updateDimensions() {
            maxTranslate = container.clientWidth - knob.clientWidth - 12; // accounting for padding
        }

        window.addEventListener('resize', updateDimensions);
        window.addEventListener('load', updateDimensions);

        // Touch & Mouse Event Listeners for Swiping
        knob.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        knob.addEventListener('touchstart', dragStart, { passive: true });
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            if (isCompleted) return;
            isDragging = true;
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            updateDimensions();
        }

        function drag(e) {
            if (!isDragging || isCompleted) return;
            
            if (e.type === 'touchmove') {
                e.preventDefault(); // prevent scrolling while swiping
            }

            const currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const diffX = currentX - startX;

            currentTranslate = Math.max(0, Math.min(diffX, maxTranslate));
            knob.style.transform = `translateX(${currentTranslate}px)`;

            // Fade out prompt text as you swipe
            const progress = currentTranslate / maxTranslate;
            swipeText.style.opacity = Math.max(0, 1 - progress * 2);

            // Trigger success when dragged past 85%
            if (progress >= 0.85) {
                triggerSuccess();
            }
        }

        function dragEnd() {
            if (!isDragging || isCompleted) return;
            isDragging = false;

            if (currentTranslate < maxTranslate * 0.85) {
                // Snap back if not dragged far enough
                resetSwipe();
            }
        }

        function triggerSuccess() {
            isCompleted = true;
            isDragging = false;
            
            // Snap to end
            knob.style.transform = `translateX(${maxTranslate}px)`;
            knob.classList.add('bg-emerald-500', 'text-white');
            knobIcon.className = "fa-solid fa-check text-white text-xl";
            
            swipeText.style.opacity = '0';
            swipeSuccess.style.opacity = '1';

            // Perform Share Action
            executeShare();

            // Reset after 3.5 seconds for repeat usage
            setTimeout(() => {
                resetSwipe();
            }, 3500);
        }

        function resetSwipe() {
            isCompleted = false;
            currentTranslate = 0;
            knob.style.transform = `translateX(0px)`;
            knob.classList.remove('bg-emerald-500', 'text-white');
            knob.classList.add('bg-white');
            knobIcon.className = "fa-solid fa-share-nodes text-[#00779b] text-xl";
            swipeText.style.opacity = '1';
            swipeSuccess.style.opacity = '0';
        }

        function executeShare() {
            const shareData = {
                title: "Nur's Link Landing Page",
                text: "Check out Nur's links and profile!",
                url: window.location.href
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                // Fallback copy link to clipboard using execCommand
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                showToast('Link copied to clipboard!');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
