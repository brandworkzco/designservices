<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Outer circle background with subtle drop shadow -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular container -->
  <circle cx="60" cy="60" r="54" fill="#FFFFFF" filter="url(#shadow)" />
  <circle cx="60" cy="60" r="53" fill="#F8F9FA" />

  <!-- Person avatar paths -->
  <g fill="none" stroke="#D0D5DD" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="60" cy="46" r="14" />
    <!-- Shoulders / Body -->
    <path d="M 37,78 A 23,23 0 0,1 83,78" />
  </g>
</svg>
